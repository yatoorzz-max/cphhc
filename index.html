<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7661c9">
<title>OC Archive | 我的角色档案库</title>
<style>
:root {
  --purple:#7661c9;
  --deep:#55439e;
  --mint:#b8f0df;
  --bg:#f6f3ff;
  --ink:#30284b;
  --muted:#827a99;
  --white:#fff;
  --line:#e8e1f5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif;
}
header {
  padding:22px 18px;
  max-width:1000px;
  margin:auto;
}
nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {font-weight:900;font-size:19px}
.logo span {color:var(--purple)}
button {
  border:0;
  border-radius:13px;
  padding:11px 16px;
  background:var(--purple);
  color:white;
  font-weight:700;
  cursor:pointer;
}
button.mint {background:var(--mint);color:#245748}
button.light {background:white;color:var(--purple);border:1px solid var(--line)}
.hero {
  margin-top:22px;
  padding:28px 22px;
  border-radius:25px;
  color:white;
  background:linear-gradient(135deg,#7661c9,#a394e3);
}
.hero h1 {font-size:30px;line-height:1.3;margin:0 0 10px}
.hero p {margin:0;opacity:.9}
main {max-width:1000px;margin:auto;padding:0 18px 45px}
.toolbar {display:flex;gap:9px;margin:20px 0;flex-wrap:wrap}
input,textarea,select {
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
  color:var(--ink);
  font:inherit;
}
#search {flex:1;min-width:180px}
.categories {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
}
.category {
  white-space:nowrap;
  background:white;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:30px;
}
.category.active {
  background:var(--mint);
  color:#245748;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
}
.card {
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--line);
}
.cover {
  height:175px;
  background:linear-gradient(135deg,#e9e2ff,#d8f8ec);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:#9988c8;
}
.cover img {width:100%;height:100%;object-fit:cover}
.card-content {padding:15px}
.tag {
  display:inline-block;
  background:#e4f8f0;
  color:#437d6b;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.card h3 {margin:10px 0 5px}
.description {font-size:14px;color:var(--muted)}
.card-actions {display:flex;gap:7px;margin-top:13px}
.card-actions button {flex:1;font-size:13px;padding:9px}
.empty {
  text-align:center;
  padding:40px 10px;
  color:var(--muted);
}
dialog {
  border:0;
  border-radius:22px;
  width:min(550px,calc(100% - 24px));
  padding:20px;
  color:var(--ink);
  max-height:90vh;
  overflow:auto;
}
dialog::backdrop {background:#21153e77}
form {display:grid;gap:13px}
label {display:grid;gap:6px;font-size:14px;font-weight:700}
textarea {min-height:100px;resize:vertical}
.form-actions {display:flex;justify-content:flex-end;gap:8px}
#adminPanel {
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin:15px 0;
}
footer {
  text-align:center;
  color:var(--muted);
  padding:25px;
  font-size:13px;
}
[hidden] {display:none!important}
</style>
</head>
<body>

<header>
<nav>
  <div class="logo">✦ <span>OC</span> ARCHIVE</div>
  <button class="light" id="adminButton">管理员入口</button>
</nav>

<section class="hero">
  <h1>角色档案，<br>收藏每一种故事。</h1>
  <p>一个属于原创角色与世界观的小小收藏室。</p>
</section>
</header>

<main>

<section id="adminPanel" hidden>
  <h3>管理模式</h3>
  <div class="toolbar">
    <button id="addButton">＋ 新建 OC</button>
    <button class="mint" id="exportButton">导出备份</button>
    <button class="light" id="importButton">导入备份</button>
    <button class="light" id="exitButton">退出管理</button>
  </div>
  <input type="file" id="backupFile" accept=".json" hidden>
</section>

<div class="toolbar">
  <input id="search" placeholder="搜索角色名称、设定……">
  <button class="mint" id="refreshButton">刷新</button>
</div>

<div class="categories" id="categories"></div>
<div class="grid" id="cardGrid"></div>
<div class="empty" id="emptyMessage">
  这里还没有 OC 档案。
</div>

</main>

<footer>Made with care · OC Archive</footer>

<dialog id="editor">
<form id="ocForm">
<h2 id="formTitle">新建 OC</h2>
<input type="hidden" id="ocId">

<label>角色名称
<input id="ocName" required maxlength="100">
</label>

<label>分类
<input id="ocCategory" placeholder="例如：主角、反派、原创世界">
</label>

<label>角色简介
<textarea id="ocDescription"></textarea>
</label>

<label>详细设定
<textarea id="ocDetails" style="min-height:170px"></textarea>
</label>

<label>角色封面
<input type="file" id="ocImage" accept="image/*">
</label>

<div class="form-actions">
<button type="button" class="light" id="cancelButton">取消</button>
<button type="submit">保存档案</button>
</div>
</form>
</dialog>

<dialog id="detail">
<div id="detailContent"></div>
<div class="form-actions">
<button class="light" id="closeDetail">关闭</button>
</div>
</dialog>

<script>

const $ = id => document.getElementById(id);

let archives = JSON.parse(
  localStorage.getItem("oc_archive_data") || "[]"
);

let isAdmin = false;
let currentCategory = "全部";

function saveData() {
  localStorage.setItem(
    "oc_archive_data",
    JSON.stringify(archives)
  );
}

function safe(text = "") {
  return String(text).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function render() {
  const categories = [
    "全部",
    ...new Set(archives.map(a => a.category || "未分类"))
  ];

  $("categories").innerHTML = categories.map(category => `
    <button class="category ${
      category === currentCategory ? "active" : ""
    }" data-category="${safe(category)}">
      ${safe(category)}
    </button>
  `).join("");

  document.querySelectorAll("[data-category]").forEach(button => {
    button.onclick = () => {
      currentCategory = button.dataset.category;
      render();
    };
  });

  const keyword = $("search").value.toLowerCase().trim();

  const filtered = archives.filter(archive => {
    const matchesCategory =
      currentCategory === "全部" ||
      archive.category === currentCategory;

    const text = [
      archive.name,
      archive.category,
      archive.description,
      archive.details
    ].join(" ").toLowerCase();

    return matchesCategory && text.includes(keyword);
  });

  $("cardGrid").innerHTML = filtered.map(archive => `
    <article class="card">
      <div class="cover">
        ${
          archive.image
          ? `<img src="${archive.image}" alt="">`
          : "✦"
        }
      </div>

      <div class="card-content">
        <span class="tag">
          ${safe(archive.category || "未分类")}
        </span>

        <h3>${safe(archive.name)}</h3>

        <div class="description">
          ${safe(archive.description || "暂无简介")}
        </div>

        <div class="card-actions">
          <button class="mint" data-view="${archive.id}">
            查看
          </button>

          ${
            isAdmin
            ? `<button data-edit="${archive.id}">编辑</button>
               <button style="background:#c45472"
               data-delete="${archive.id}">删除</button>`
            : ""
          }
        </div>
      </div>
    </article>
  `).join("");

  $("emptyMessage").hidden = filtered.length > 0;

  document.querySelectorAll("[data-view]").forEach(button => {
    button.onclick = () => showDetail(button.dataset.view);
  });

  document.querySelectorAll("[data-edit]").forEach(button => {
    button.onclick = () => editArchive(button.dataset.edit);
  });

  document.querySelectorAll("[data-delete]").forEach(button => {
    button.onclick = () => deleteArchive(button.dataset.delete);
  });
}

function showDetail(id) {
  const archive = archives.find(a => a.id === id);
  if (!archive) return;

  $("detailContent").innerHTML = `
    <h2>${safe(archive.name)}</h2>
    <span class="tag">${safe(archive.category || "未分类")}</span>
    <p>${safe(archive.description)}</p>
    <hr style="border:0;border-top:1px solid #e8e1f5">
    <div style="white-space:pre-wrap;overflow-wrap:anywhere">
      ${safe(archive.details || "暂无详细设定")}
    </div>
  `;

  $("detail").showModal();
}

function editArchive(id = "") {
  const archive = archives.find(a => a.id === id);

  $("formTitle").textContent = archive ? "编辑 OC" : "新建 OC";

  $("ocId").value = archive?.id || "";
  $("ocName").value = archive?.name || "";
  $("ocCategory").value = archive?.category || "";
  $("ocDescription").value = archive?.description || "";
  $("ocDetails").value = archive?.details || "";
  $("ocImage").value = "";

  $("editor").showModal();
}

async function deleteArchive(id) {
  if (!confirm("确定删除这个 OC 档案吗？")) return;

  archives = archives.filter(a => a.id !== id);

  saveData();
  render();
}

$("ocForm").onsubmit = async event => {
  event.preventDefault();

  const id = $("ocId").value || crypto.randomUUID();

  const old = archives.find(a => a.id === id);

  let image = old?.image || "";

  const file = $("ocImage").files[0];

  if (file) {
    image = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;

      reader.readAsDataURL(file);
    });
  }

  const archive = {
    id,
    name: $("ocName").value.trim(),
    category: $("ocCategory").value.trim() || "未分类",
    description: $("ocDescription").value,
    details: $("ocDetails").value,
    image
  };

  archives = archives.filter(a => a.id !== id);
  archives.unshift(archive);

  saveData();

  $("editor").close();
  render();
};

$("adminButton").onclick = () => {
  if (!isAdmin) {
    const password = prompt("请输入管理员密码");

    if (password !== "123456") {
      alert("密码不正确");
      return;
    }

    isAdmin = true;
    $("adminPanel").hidden = false;
    $("adminButton").textContent = "管理中";
    render();
  } else {
    $("adminPanel").hidden = false;
  }
};

$("exitButton").onclick = () => {
  isAdmin = false;
  $("adminPanel").hidden = true;
  $("adminButton").textContent = "管理员入口";
  render();
};

$("addButton").onclick = () => editArchive();

$("cancelButton").onclick = () => {
  $("editor").close();
};

$("closeDetail").onclick = () => {
  $("detail").close();
};

$("search").oninput = render;
$("refreshButton").onclick = render;

$("exportButton").onclick = () => {
  const backup = new Blob(
    [JSON.stringify({version:1,archives}, null, 2)],
    {type:"application/json"}
  );

  const link = document.createElement("a");
  link.href = URL.createObjectURL(backup);
  link.download = "OC档案备份.json";
  link.click();

  URL.revokeObjectURL(link.href);
};

$("importButton").onclick = () => {
  $("backupFile").click();
};

$("backupFile").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());

    if (!Array.isArray(data.archives)) {
      throw new Error("备份格式不正确");
    }

    if (!confirm("导入会替换当前浏览器中的档案，继续吗？")) {
      return;
    }

    archives = data.archives;
    saveData();
    render();

    alert("档案导入成功！");
  } catch (error) {
    alert("导入失败：" + error.message);
  }

  event.target.value = "";
};

render();
</script>
</body>
</html>
