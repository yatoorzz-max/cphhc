<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 OC 人设卡</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; color: #333; }
  h1 { text-align: center; font-size: 24px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: relative; }
  .card img { width: 100%; display: block; }
  .card-body { padding: 15px; }
  .card-title { font-weight: bold; margin-bottom: 8px; font-size: 16px; }
  .card-desc { font-size: 14px; color: #666; line-height: 1.6; }
  .annotation {
    position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,0.75); color: #fff; padding: 10px;
    border-radius: 8px; font-size: 13px; line-height: 1.5;
    opacity: 0; transition: 0.3s;
  }
  .card:hover .annotation { opacity: 1; }
</style>
</head>
<body>

<h1>我的 OC 人设卡</h1>

<div class="gallery">

  <!-- 第一张图片卡片 -->
  <div class="card">
    <img src="images/IMG_2759.JPG" alt="立绘">
    <div class="annotation">这里写鼠标放上去显示的标注</div>
    <div class="card-body">
      <div class="card-title">第一张图的名字</div>
      <div class="card-desc">这里写详细的文字介绍。</div>
    </div>
  </div>

  <!-- 第二张图片卡片 -->
  <div class="card">
    <img src="images/IMG_2760.JPG" alt="服设">
    <div class="annotation">这里写悬停标注</div>
    <div class="card-body">
      <div class="card-title">第二张图的名字</div>
      <div class="card-desc">这里写第二张图的描述。</div>
    </div>
  </div>

</div>

</body>
</html>
