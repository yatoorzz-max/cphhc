<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 OC 云端相册</title>
<style>
  body { font-family: sans-serif; background: #eef2f6; padding: 20px; color: #333; max-width: 800px; margin: 0 auto; }
  .header { text-align: center; padding: 20px 0; }
  /* 上传按钮样式 */
  .upload-btn { display: block; width: 100%; padding: 15px; background: #34d399; color: white; text-align: center; border-radius: 8px; font-weight: bold; margin-bottom: 20px; cursor: pointer; font-size: 16px; }
  input[type="file"] { display: none; }
  
  /* 图片网格 */
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .img-box { aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; cursor: pointer; background: #fff; }
  .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
  .img-box img:hover { transform: scale(1.1); }
  
  /* 放大查看遮罩 */
  #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
  #lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
</style>
<!-- 引入 Supabase 核心库 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="header">
  <h1>我的 OC 云端相册</h1>
  <p style="font-size: 12px; color: #666;">上传成功后，图片会自动保存在云端，刷新页面即可查看</p>
</div>

<!-- 上传图片的入口 -->
<label class="upload-btn" id="uploadLabel">
  <span id="uploadText">点击从手机相册选择图片上传</span>
  <input type="file" id="fileInput" multiple accept="image/*">
</label>

<div class="img-grid" id="gallery">
  <!-- 图片会由代码自动加载到这里 -->
  <p style="text-align: center; grid-column: 1/-1; color: #999;">正在从云端获取图片...</p>
</div>

<!-- 全屏查看 -->
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" src="">
</div>

<script>
  // ⚠️ 这里填入你 Supabase 的两个信息
  const supabaseUrl = '你的URL';
  const supabaseKey = '你的API_KEY';
  
  // 初始化 Supabase
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
  const bucketName = 'images';

  // 1. 从云端获取图片列表并展示
  async function loadImages() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #999;">加载中...</p>';
    
    // 获取 images 桶里的所有文件
    const { data, error } = await supabase.storage.from(bucketName).list();
    
    if (error) {
      gallery.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: red;">获取失败，请检查配置</p>';
      return;
    }
    
    gallery.innerHTML = '';
    if (data.length === 0) {
      gallery.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #999;">云端还没有图片哦，点上面的按钮传一张吧！</p>';
      return;
    }

    // 按名字排序，生成图片网格
    data.sort((a, b) => a.name.localeCompare(b.name)).forEach(file => {
      // 获取图片的公开访问 URL
      const { data: urlData } = supabase.storage.from(bucketName).getPublicUrl(file.name);
      const imgUrl = urlData.publicUrl;

      const box = document.createElement('div');
      box.className = 'img-box';
      box.onclick = () => openLightbox(imgUrl);
      box.innerHTML = `<img src="${imgUrl}" loading="lazy">`;
      gallery.appendChild(box);
    });
  }

  // 2. 处理手机选图并上传
  const fileInput = document.getElementById('fileInput');
  const uploadText = document.getElementById('uploadText');

  fileInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    if (files.length === 0) return;

    uploadText.innerText = "正在努力上传中...";
    
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      // 为了防止名字冲突，加上时间戳作为文件名
      const fileName = `${Date.now()}_${file.name}`;
      
      const { error } = await supabase.storage
        .from(bucketName)
        .upload(fileName, file);

      if (error) {
        alert(`图片 ${file.name} 上传失败: ` + error.message);
      }
    }

    uploadText.innerText = "上传完成！刷新中...";
    // 上传完成后刷新相册
    loadImages();
    setTimeout(() => { uploadText.innerText = "点击从手机相册选择图片上传"; }, 2000);
  });

  // 3. 点击放大
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  // 页面打开时执行加载
  loadImages();
</script>
</body>
</html>
